<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d3f9e">
<title>تدريب مقياس موهبة</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--b:#1d3f9e;--b2:#14296b;--b3:#e8eefc;--g:#c9a227;--g2:#9a7a14;--gl:#fbf4d9;--tx:#141c3a;--mu:#5b6482;--bd:#dfe4f1;--ok:#0f7a55;--okb:#e7f6ef;--no:#b4323a;--nob:#fcecec;--a:#1d3f9e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:#fff;color:var(--tx);font-family:"Noto Naskh Arabic","Segoe UI",Tahoma,sans-serif;font-weight:500;line-height:1.8;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
svg{display:block;max-width:100%}
.wrap{max-width:820px;margin:0 auto;padding:0 14px}
.tops{position:fixed;z-index:60;left:10px;top:calc(8px + env(safe-area-inset-top,0px));display:flex;gap:6px}
.printbtn{background:var(--g);color:#2a1f00;font-weight:700;font-size:.78rem;padding:5px 12px;border-radius:99px;box-shadow:0 3px 10px rgba(0,0,0,.2)}
/* cover */
.cover{position:relative;background:repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0 2px,transparent 2px 16px),linear-gradient(135deg,var(--b2),var(--b));color:#fff;padding:calc(34px + env(safe-area-inset-top,0px)) 16px 52px;overflow:hidden}
.cover::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-1px;height:30px;background:#fff;border-radius:50% 50% 0 0/100% 100% 0 0}
.cin{max-width:820px;margin:auto;display:flex;align-items:center;gap:14px}
.lg{width:62px;height:62px;border-radius:16px;background:#fff;display:grid;place-items:center;font-size:1.9rem;overflow:hidden;flex:0 0 auto;border:2px solid var(--g)}
.lg img{width:100%;height:100%;object-fit:contain}
.cover h1{margin:0;font-size:1.3rem;line-height:1.4}
.cover small{display:block;opacity:.85;font-size:.82rem}
.badge{display:inline-block;background:var(--g);color:#2a1f00;font-weight:700;font-size:.72rem;padding:1px 12px;border-radius:99px;margin-bottom:3px}
/* sections */
.sec{display:flex;align-items:center;gap:8px;margin:20px 0 10px;font-size:1rem;font-weight:700;color:var(--b2)}
.sec::before{content:"";width:5px;height:20px;border-radius:3px;background:var(--g)}
.card{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:14px;border-right:4px solid var(--b)}
.form{display:grid;grid-template-columns:1.25fr 1fr;gap:10px}.form select{font-size:.9rem}
.form .full{grid-column:1/-1}
.form label{display:block;font-size:.78rem;color:var(--mu);font-weight:700}
.form input[type=text],.form select{width:100%;padding:9px 11px;border:1.5px solid var(--bd);border-radius:11px;background:#fff}
.form input:focus,.form select:focus{outline:none;border-color:var(--b)}

.lrow{display:flex;align-items:center;gap:10px}
.lrow img{width:44px;height:44px;object-fit:contain;border:1px solid var(--bd);border-radius:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:12px;font-weight:700;font-size:.88rem;background:var(--b);color:#fff;transition:.15s}
.btn:active{transform:scale(.97)}
.btn.gold{background:var(--g);color:#2a1f00}
.btn.light{background:var(--b3);color:var(--b)}
.btn.big{padding:12px 20px;width:100%;font-size:.95rem}
.sum{display:flex;align-items:center;gap:10px}
.sum b{flex:1}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:12px}
.tile{background:#fff;border:1px solid var(--bd);border-top:5px solid var(--a);border-radius:18px;padding:18px 14px 14px;box-shadow:0 4px 14px rgba(20,41,107,.08);display:flex;flex-direction:column;gap:8px}
.th{display:flex;align-items:center;gap:9px}
.th .ic{width:50px;height:50px;border-radius:13px;background:var(--a);display:grid;place-items:center;font-size:1.5rem;flex:0 0 auto}
.th b{display:block;font-size:1.12rem;line-height:1.3;color:var(--a)}
.th small{display:block;color:var(--mu);font-size:.74rem;line-height:1.4}
.pr{font-size:.76rem;color:var(--mu)}
.pr em{font-style:normal;font-weight:700;color:var(--a)}
.mb{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin:3px 0}
.mb i{display:block;height:100%;background:var(--a);border-radius:9px}
.tb{display:grid;gap:6px;margin-top:2px}
.tb button{font-size:.84rem;font-weight:700;padding:9px 0;border-radius:12px;background:var(--b3);color:var(--a)}
.tb button:last-child{background:var(--a);color:#fff}
.foot{margin:28px 0 20px;padding-top:12px;border-top:2px solid var(--g);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.76rem;color:var(--mu)}
.map{display:flex;flex-direction:column;align-items:center;gap:6px;margin:8px 0}
.map .ct{background:var(--a);color:#fff;border-radius:99px;padding:3px 20px;font-weight:700}
.map .ln{width:2px;height:12px;background:var(--g)}
.map .br{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.map .br span{border:1.5px solid var(--a);color:var(--a);border-radius:10px;padding:1px 11px;font-size:.82rem;font-weight:700;background:#fff}
.tw{overflow-x:auto;border-radius:12px;border:1px solid var(--bd)}
.tbl{width:100%;border-collapse:collapse;font-size:.82rem;min-width:420px}
.tbl th{background:var(--a);color:#fff;padding:6px 8px;text-align:start}
.tbl td{padding:6px 8px;border-top:1px solid var(--bd);vertical-align:top}
.tbl td:first-child{font-weight:700;color:var(--a);background:var(--gl);white-space:nowrap}
.par{border:1px solid var(--bd);border-right:4px solid var(--a);border-radius:12px;padding:10px 14px;background:#f6f8fe;font-size:.88rem}
/* overlay */
.ov{position:fixed;inset:0;z-index:100;background:#fff;transform:translateY(100%);visibility:hidden;transition:transform .3s,visibility 0s .3s}
.ov.open{transform:none;visibility:visible;transition:transform .3s}
.sh{display:flex;flex-direction:column;height:100%}
.bar{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:var(--b);color:#fff}
.bar button{width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.15);color:#fff;font-size:1rem}
.bar b{flex:1}
.bar span{background:var(--g);color:#2a1f00;font-weight:700;font-size:.78rem;padding:2px 10px;border-radius:9px}
.pb{height:4px;background:var(--bd)}.pb i{display:block;height:100%;background:var(--g);transition:width .3s}
.body{flex:1;overflow-y:auto;padding:14px 14px calc(30px + env(safe-area-inset-bottom,0px))}
.in{max-width:720px;margin:auto}
.hd{background:var(--a);color:#fff;border-radius:12px;padding:3px 14px;font-weight:700;font-size:.9rem;margin:16px 0 8px}
.box{border:1px solid var(--bd);border-right:4px solid var(--g);border-radius:12px;padding:10px 14px;background:var(--gl);font-size:.9rem}
.tips{display:grid;gap:8px}
.tip{display:flex;gap:10px;border:1px solid var(--bd);border-radius:12px;padding:8px 12px;font-size:.88rem}
.tip i{font-style:normal;width:24px;height:24px;border-radius:8px;background:var(--b3);color:var(--a);display:grid;place-items:center;font-weight:700;font-size:.8rem;flex:0 0 auto}
.fig{background:#f6f8fe;border:1px solid var(--bd);border-radius:14px;padding:10px;margin:12px 0;display:flex;justify-content:center}
.fig svg{width:100%;max-width:440px;height:auto}
.fig text{font-family:inherit}
.lab{margin:10px 0}
.ctl{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.ctl button{font-size:.78rem;font-weight:700;padding:5px 11px;border-radius:99px;background:var(--b3);color:var(--b)}
.ctl button.on{background:var(--b);color:#fff}
.ltxt{font-size:.84rem;color:var(--mu);text-align:center;min-height:1.8em}
input[type=range]{width:100%;accent-color:var(--b)}
.qhd{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.lv{font-size:.72rem;font-weight:700;padding:1px 10px;border-radius:8px;background:var(--b3);color:var(--b)}
.lv.l2{background:var(--gl);color:var(--g2)}.lv.l3{background:var(--nob);color:var(--no)}
.qt{font-size:1.02rem;font-weight:700;line-height:1.9}
.opts{display:grid;gap:8px;margin-top:10px}
.opt{display:flex;align-items:center;gap:10px;text-align:start;padding:10px 12px;border:1.5px solid var(--bd);border-radius:13px;background:#fff;font-size:.92rem}
.opt b{width:26px;height:26px;border-radius:8px;background:var(--b3);color:var(--a);display:grid;place-items:center;font-size:.8rem;flex:0 0 auto}
.opt.ok{border-color:var(--ok);background:var(--okb)}.opt.ok b{background:var(--ok);color:#fff}
.opt.no{border-color:var(--no);background:var(--nob)}.opt.no b{background:var(--no);color:#fff}
.fb{margin-top:12px;padding:10px 14px;border-radius:13px;font-size:.88rem}
.fb.ok{background:var(--okb);border:1px solid var(--ok)}.fb.no{background:var(--nob);border:1px solid var(--no)}
.fb p{margin:0 0 2px;font-weight:700}
.res{text-align:center}.res .pc{font-size:3rem;font-weight:700;color:var(--a);line-height:1.2}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.st div{border:1px solid var(--bd);border-radius:12px;padding:6px}.st b{display:block;color:var(--a)}
.rv{text-align:start;border-top:1px solid var(--bd);padding:8px 0;font-size:.85rem}
@media print{.printbtn,.tb,.ctl{display:none}.cover{-webkit-print-color-adjust:exact;print-color-adjust:exact}}

.exm{border:1.5px dashed var(--a);border-radius:16px;padding:12px 14px;background:#fff}
.exm .q{font-weight:700;margin-bottom:8px}
.exm .ans{margin-top:8px;background:var(--okb);border:1px solid var(--ok);border-radius:11px;padding:6px 12px;font-weight:700;color:var(--ok)}
.cf{position:fixed;inset:0;z-index:300;pointer-events:none;overflow:hidden}
.cf i{position:absolute;width:9px;height:14px;border-radius:2px;animation:bm 1.9s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes bm{to{transform:translate(var(--x),calc(var(--y) + 340px)) rotate(var(--r));opacity:0}}
.rp{max-width:760px;margin:auto}
.rph{text-align:center;border:2px solid var(--g);border-radius:18px;padding:14px;background:linear-gradient(180deg,#fff,var(--gl))}
.rph h2{margin:2px 0;color:var(--b2)}.rph small{color:var(--mu)}
.rid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0;font-size:.85rem}
.rid div{border:1px solid var(--bd);border-radius:11px;padding:5px 8px;background:#fff}.rid b{display:block;color:var(--b);font-size:.72rem}
.big{display:flex;align-items:center;gap:14px;border:1px solid var(--bd);border-radius:16px;padding:12px;margin:10px 0}
.big svg{width:104px;height:104px;flex:0 0 auto}
.rbar{height:9px;background:var(--bd);border-radius:9px;overflow:hidden;min-width:70px}.rbar i{display:block;height:100%}
.lst{margin:4px 0;padding:0 18px;font-size:.88rem}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:26px;font-size:.84rem;text-align:center}.sg div{border-top:1.5px solid var(--mu);padding-top:4px}
.bar button.sn{font-size:.95rem}
@media print{body.rp #app,body.rp .tops,.bar,.noprint{display:none!important}body.rp{overflow:visible!important}body.rp .ov{position:static!important;transform:none!important;visibility:visible!important}body.rp .sh{height:auto!important}body.rp .body{overflow:visible!important;padding:0}.rph,.big,.tbl th,.hd,.rbar i{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body>
<div class="tops"><button class="printbtn" onclick="window.print()">🖨 طباعة / PDF</button><button class="printbtn" id="sb" onclick="tgS(this)">🔊</button></div>
<div id="app"></div>
<div class="ov" id="ov"><div class="sh" id="sh"></div></div>

<script>
/* ================= أدوات الرسم ================= */
const PI=Math.PI,M=2.2,H=6,GC=["#2c52b8","#7f9ae0"];
const MU="#5b6482",B="#1d3f9e",G="#c9a227",NO="#b4323a",OK="#0f7a55";
const svg=(vb,s)=>`<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg">${s}</svg>`;
const tx=(x,y,s,c,z,w)=>`<text x="${x}" y="${y}" text-anchor="middle" font-size="${z||12}" font-weight="${w||600}" fill="${c||MU}">${s}</text>`;

/* ترس بأسنان حقيقية: T عدد الأسنان */
function gp(T,r){let d="";const p=2*PI/T,ri=r-H/2,ro=r+H/2;
  for(let k=0;k<T;k++){[[-.3,ri],[-.17,ro],[.17,ro],[.3,ri]].forEach((q,j)=>{const t=k*p+q[0]*p;d+=(k+j?"L":"M")+(q[1]*Math.cos(t)).toFixed(1)+" "+(q[1]*Math.sin(t)).toFixed(1)})}
  return d+"Z"}
function gearG(id,x,y,T,deg,i){const r=T*M;
  return `<g id="${id}" transform="translate(${x} ${y}) rotate(${deg})"><path d="${gp(T,r)}" fill="${GC[i%2]}" stroke="#14296b" stroke-width="1.5" stroke-linejoin="round"/><circle r="${r*.58}" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="2"/><circle r="${r*.2}" fill="#fff" stroke="#14296b" stroke-width="1.5"/><circle cx="${r*.75}" r="3.4" fill="${G}"/></g>`}
/* زوايا التروس المتلامسة (تطابق الأسنان) */
function meshAng(Ts,t){const a=[t];for(let i=1;i<Ts.length;i++)a.push(PI-PI/Ts[i]-(Ts[i-1]/Ts[i])*a[i-1]);return a.map(x=>x*180/PI)}
/* سير حول ترسين */
function belt(x1,r1,x2,r2,y,cr){r1+=3;r2+=3;const d=x2-x1,f=Math.asin(((cr?r1+r2:r1-r2))/d),s=Math.sin(f),c=Math.cos(f),n=v=>v.toFixed(1);
  if(!cr){const L1=f>0?1:0,L2=f<0?1:0;
    return `M${n(x1+r1*s)} ${n(y-r1*c)}L${n(x2+r2*s)} ${n(y-r2*c)}A${r2} ${r2} 0 ${L2} 1 ${n(x2+r2*s)} ${n(y+r2*c)}L${n(x1+r1*s)} ${n(y+r1*c)}A${r1} ${r1} 0 ${L1} 1 ${n(x1+r1*s)} ${n(y-r1*c)}Z`}
  return `M${n(x1+r1*s)} ${n(y-r1*c)}L${n(x2-r2*s)} ${n(y+r2*c)}A${r2} ${r2} 0 1 0 ${n(x2-r2*s)} ${n(y-r2*c)}L${n(x1+r1*s)} ${n(y+r1*c)}A${r1} ${r1} 0 1 1 ${n(x1+r1*s)} ${n(y-r1*c)}Z`}
/* شكل ثابت للأسئلة: Ts أسنان، labels، opt: {belt:'open'|'cross'} */
function GS(Ts,lb,o){o=o||{};const rs=Ts.map(t=>t*M),y=20+Math.max(...rs);let xs=[],x=14+rs[0];xs.push(x);
  for(let i=1;i<Ts.length;i++){x+=rs[i-1]+rs[i]+(o.belt?60:0);xs.push(x)}
  const W=x+rs[rs.length-1]+14,Hh=2*y+8;
  let s=o.belt?`<path d="${belt(xs[0],rs[0],xs[1],rs[1],y,o.belt==="cross")}" fill="none" stroke="#6b7694" stroke-width="5" stroke-linejoin="round"/><path d="${belt(xs[0],rs[0],xs[1],rs[1],y,o.belt==="cross")}" fill="none" stroke="${G}" stroke-width="1.5" stroke-dasharray="7 6"/>`:"";
  const an=o.belt?Ts.map(()=>0):meshAng(Ts,0);
  Ts.forEach((t,i)=>{s+=gearG("",xs[i],y,t,an[i],i)+tx(xs[i],Hh-6,lb[i],B,13,700)});
  if(o.spin)s+=tx(xs[0],14,o.spin,G,20,700);
  return svg(`0 0 ${W.toFixed(0)} ${Hh+14}`,s)}

const FIG={};
FIG.gears2=GS([14,14],["A","B"],{spin:"↻"});
FIG.gears3=GS([14,14,14],["A","B","C"],{spin:"↻"});
FIG.gearsTrain=GS([10,20],["A (١٠ أسنان)","B (٢٠ سنًّا)"],{spin:"↻"});
FIG.beltOpen=GS([12,12],["A","B"],{belt:"open",spin:"↻"});
FIG.beltCross=GS([12,12],["A","B"],{belt:"cross",spin:"↻"});
FIG.beltSize=GS([10,30],["A (١٠ أسنان)","B (٣٠ سنًّا)"],{belt:"open",spin:"↻"});

FIG.scissors=svg("0 0 400 210",
 '<g stroke="#14296b" stroke-width="2" stroke-linejoin="round"><path d="M385 78L200 112L120 140L110 128L195 98L385 62Z" fill="#cfd8ea"/><path d="M385 146L200 112L120 84L110 96L195 126L385 162Z" fill="#aebbd6"/></g>'+
 '<circle cx="78" cy="150" r="26" fill="none" stroke="#14296b" stroke-width="9"/><circle cx="78" cy="74" r="26" fill="none" stroke="#c9a227" stroke-width="9"/>'+
 '<circle cx="200" cy="112" r="8" fill="#c9a227" stroke="#14296b" stroke-width="2"/>'+
 tx(200,140,"المسمار: نقطة الارتكاز",MU,12)+tx(330,40,"طرف الشفرتين",MU,12)+tx(90,200,"المقبضان",MU,12)+
 '<line x1="262" y1="104" x2="262" y2="120" stroke="#b4323a" stroke-width="3"/>'+tx(262,98,"ورقة سميكة؟",NO,11));

FIG.leverA=svg("0 0 400 200",
 '<line x1="15" y1="172" x2="385" y2="172" stroke="#dfe4f1" stroke-width="5" stroke-linecap="round"/>'+
 '<polygon points="200,106 172,172 228,172" fill="#e8eefc" stroke="#1d3f9e" stroke-width="2.2" stroke-linejoin="round"/>'+
 '<rect x="38" y="92" width="324" height="14" rx="6" fill="#2c52b8"/>'+
 '<rect x="50" y="46" width="54" height="46" rx="6" fill="#8b94a8" stroke="#5b6482" stroke-width="2"/>'+tx(77,76,"الحمل","#fff",12)+
 '<line x1="248" y1="50" x2="248" y2="90" stroke="#b4323a" stroke-width="3" stroke-dasharray="5 4"/><polygon points="248,92 242,80 254,80" fill="#b4323a"/>'+tx(248,42,"(١)",NO,12)+
 '<line x1="334" y1="50" x2="334" y2="90" stroke="#0f7a55" stroke-width="3" stroke-dasharray="5 4"/><polygon points="334,92 328,80 340,80" fill="#0f7a55"/>'+tx(334,42,"(٢)",OK,12)+
 tx(200,192,"نقطة الارتكاز",MU,12));
FIG.leverC=svg("0 0 420 210",
 '<line x1="15" y1="178" x2="405" y2="178" stroke="#dfe4f1" stroke-width="5" stroke-linecap="round"/>'+
 '<polygon points="90,100 62,178 118,178" fill="#e8eefc" stroke="#1d3f9e" stroke-width="2.2" stroke-linejoin="round"/>'+
 '<rect x="30" y="86" width="360" height="14" rx="6" fill="#2c52b8"/>'+
 '<rect x="128" y="38" width="48" height="48" rx="6" fill="#8b94a8" stroke="#5b6482" stroke-width="2"/>'+tx(152,68,"٦٠ كجم","#fff",11)+
 '<line x1="280" y1="46" x2="280" y2="84" stroke="#0f7a55" stroke-width="3"/><polygon points="280,86 273,72 287,72" fill="#0f7a55"/>'+tx(280,38,"؟",OK,16,800)+
 '<line x1="90" y1="196" x2="152" y2="196" stroke="#5b6482" stroke-width="1.6"/>'+tx(121,208,"١ م",MU,11)+
 '<line x1="90" y1="160" x2="280" y2="160" stroke="#0f7a55" stroke-width="1.6" stroke-dasharray="4 3"/>'+tx(185,154,"٣ م",OK,11));

const PUL='<defs><radialGradient id="pg" cx=".4" cy=".35"><stop offset="0" stop-color="#e8eefc"/><stop offset="1" stop-color="#7f9ae0"/></radialGradient></defs>';
const CEIL='<rect x="30" y="14" width="260" height="14" fill="#8b94a8"/><path d="M30 28l-10 0M70 28l-8 8M110 28l-8 8M150 28l-8 8M190 28l-8 8M230 28l-8 8M270 28l-8 8" stroke="#5b6482" stroke-width="2"/>';
const wheel=(x,y,r)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="url(#pg)" stroke="#14296b" stroke-width="3"/><circle cx="${x}" cy="${y}" r="${r*.62}" fill="none" stroke="#14296b" stroke-width="1.5"/><circle cx="${x}" cy="${y}" r="4" fill="${G}" stroke="#14296b" stroke-width="1.5"/>`;
const wt=(x,y,w,t)=>`<rect x="${x}" y="${y}" width="${w}" height="46" rx="6" fill="#8b94a8" stroke="#5b6482" stroke-width="2"/>`+tx(x+w/2,y+28,t,"#fff",12);
FIG.pulleyFixed=svg("0 0 320 250",PUL+CEIL+

function iso(list,s,ox,oy){const P=(x,y,z)=>[ox+(x-y)*s*.866,oy+(x+y)*s*.5-z*s];let o="";
 list.slice().sort((a,b)=>a[0]+a[1]+a[2]-b[0]-b[1]-b[2]).forEach(c=>{const[x,y]=P(...c),h=s*.866,q=(a,b)=>(x+a)+","+(y+b),pl=(pts,f,op)=>`<polygon points="${pts.join(" ")}" fill="${f}" stroke="#1d3f9e" stroke-width="1.6" stroke-linejoin="round" ${op?'opacity=".72"':''}/>`;
  o+=pl([q(0,0),q(h,s*.5),q(0,s),q(-h,s*.5)],"#e8eefc")+pl([q(-h,s*.5),q(0,s),q(0,2*s),q(-h,s*1.5)],"#fff")+pl([q(0,s),q(h,s*.5),q(h,s*1.5),q(0,2*s)],"#e8eefc",1)});return o}

 <div class="body"><div class="in" style="--a:${x.c}"><div class="qhd"><span class="lv l${q.l}">${["","تأسيسي","متوسط","متقدّم"][q.l]}</span></div><div class="qt">${q.q}</div>
 ${q.f?`<div class="fig">${FIG[q.f]}</div>`:""}
 <div class="opts">${q.o.map((o,i)=>`<button class="opt${an?(i===q.a?" ok":i===pk?" no":""):""}" ${an?"disabled":""} onclick="ans(${i})"><b>${LT[i]}</b><span>${o}</span></button>`).join("")}</div>
 <div id="fb">${an?fb(q,pk):""}</div>
 <button class="btn big" id="nx" style="margin-top:12px;background:${x.c};display:${an?"flex":"none"}" onclick="nxt()">${last?"عرض النتيجة 🎯":"السؤال التالي ←"}</button></div></div>`}
const fb=(q,p)=>`<div class="fb ${p===q.a?"ok":"no"}"><p>${p===q.a?"✅ إجابة صحيحة":"❌ الصواب: "+q.o[q.a]}</p>${q.e}</div>`;
function ans(i){const k=S.t+"-"+S.q;if(A[k]!==undefined)return;A[k]=i;save();sheet();if(i===T[S.t].qs[S.q].a){SFX.ok();boom(28,50,40)}else SFX.no()}
function nxt(){if(S.q>=T[S.t].qs.length-1)S.s="rs";else S.q++;sheet()}
function rsHTML(x){const s=tst(S.t),p=Math.round(s.c/s.n*100),w=x.qs.map((q,i)=>({q,i})).filter(o=>A[S.t+"-"+o.i]!==o.q.a);
 return bar(x,"النتيجة")+`<div class="body"><div class="in res" style="--a:${x.c}"><div class="pc">${p}%</div><b>${p>=90?"ممتاز 🌟":p>=70?"جيد جدًا 👏":p>=50?"جيد 💪":"راجع الشرح وحاول مجددًا 🙂"}</b>
 <div class="st"><div><b>${s.c}</b>صحيحة</div><div><b>${s.n-s.c}</b>خاطئة</div><div><b>${s.n}</b>الكل</div></div>
 ${w.length?`<div class="hd">📝 مراجعة الأخطاء</div>`+w.map(o=>`<div class="rv"><b>${o.q.q}</b><br><span style="color:var(--ok)">✔ ${o.q.o[o.q.a]}</span><br><small style="color:var(--mu)">${o.q.e}</small></div>`).join(""):`<div class="box">🎉 أداء كامل!</div>`}
 <div style="display:grid;gap:8px;margin-top:14px"><button class="btn big" style="background:${x.c}" onclick="rst()">↻ إعادة المحاولة</button><button class="btn light big" onclick="closeT()">العودة للرئيسية</button></div></div></div>`}
function rst(){T[S.t].qs.forEach((q,i)=>delete A[S.t+"-"+i]);save();S.q=0;S.s="qz";sheet()}


/* ===== صوت واحتفال ===== */
let SND=true,AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended")AC.resume();return AC}
function tone(f,t0,d,ty,v){const c=ac();if(!c||!SND)return;const o=c.createOscillator(),g=c.createGain(),s=c.currentTime+t0;o.type=ty||"sine";o.frequency.value=f;g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(v||.16,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g);g.connect(c.destination);o.start(s);o.stop(s+d+.05)}
const SFX={tap:()=>tone(520,0,.07,"triangle",.07),ok:()=>{tone(660,0,.14);tone(880,.1,.14);tone(1175,.2,.3)},no:()=>{tone(230,0,.18,"sawtooth",.07);tone(170,.16,.3,"sawtooth",.07)},win:()=>{[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,i*.13,.28,"triangle",.18))},soft:()=>{tone(440,0,.2,"sine",.12);tone(523,.18,.3,"sine",.12)}};
function tgS(b){SND=!SND;document.querySelectorAll("#sb,.sn").forEach(x=>x.textContent=SND?"🔊":"🔇");if(SND)SFX.tap()}
function boom(n,ox,oy){const w=document.createElement("div");w.className="cf";document.body.appendChild(w);const C=["#c9a227","#1d3f9e","#e7c95a","#3b64d6","#0f7a55","#ffffff"];
 for(let i=0;i<n;i++){const p=document.createElement("i"),a=Math.random()*PI*2,d=70+Math.random()*(n>40?250:130);p.style.cssText=`left:${ox}%;top:${oy}%;background:${C[i%6]};--x:${(Math.cos(a)*d).toFixed(0)}px;--y:${(Math.sin(a)*d-90).toFixed(0)}px;--r:${(Math.random()*720).toFixed(0)}deg;animation-delay:${(Math.random()*.12).toFixed(2)}s`;w.appendChild(p)}setTimeout(()=>w.remove(),2300)}
function celebrate(){const s=tst(S.t),p=s.c/s.n*100;if(p>=50){SFX.win();boom(70,50,35);setTimeout(()=>boom(50,22,40),350);setTimeout(()=>boom(50,78,40),600)}else SFX.soft()}
document.addEventListener("click",e=>{ac();if(e.target.closest("button")&&!e.target.closest(".opt,.sn,#sb"))SFX.tap()});
/* ===== التقرير النهائي ===== */
const gdg=p=>p>=90?"ممتاز":p>=75?"جيد جدًا":p>=60?"جيد":p>=50?"مقبول":"يحتاج دعمًا";
function openR(){S.s="rp";document.body.classList.add("rp");$("#ov").classList.add("open");document.body.style.overflow="hidden";sheet()}
function reportHTML(){
 let a=0,c=0,n=0;const L={1:[0,0],2:[0,0],3:[0,0]};
 T.forEach((x,t)=>x.qs.forEach((q,i)=>{n++;const v=A[t+"-"+i];if(v!==undefined){a++;L[q.l][1]++;if(v===q.a){c++;L[q.l][0]++}}}));
 const p=a?Math.round(c/a*100):0,R=2*PI*52,st=T.map((x,i)=>({x,...tst(i)}));
 st.forEach(s=>s.p=s.a?Math.round(s.c/s.a*100):0);
 const strong=st.filter(s=>s.a>=3&&s.p>=75),weak=st.filter(s=>s.a>=3&&s.p<60),idle=st.filter(s=>s.a<3);
 const li=(arr,f)=>arr.length?`<ul class="lst">${arr.map(f).join("")}</ul>`:`<p style="font-size:.86rem;color:var(--mu);margin:4px 0">لا يوجد حاليًا.</p>`;
 const d=new Date().toLocaleDateString("ar-SA",{year:"numeric",month:"long",day:"numeric"});
 return `<div class="bar noprint"><button onclick="closeT()">✕</button><b>📊 التقرير النهائي</b><button class="sn" onclick="tgS(this)">${SND?"🔊":"🔇"}</button></div><div class="body"><div class="rp" style="--a:#1d3f9e">
 <div class="rph"><span class="badge">مقياس موهبة</span><h2>${SCHOOL}</h2><small>التقرير النهائي لأداء الطالب في التدريب</small>
 <div class="rid"><div><b>الطالب</b>${P.name||"—"}</div><div><b>الصف</b>${P.grade||"—"}</div><div><b>التاريخ</b>${d}</div></div></div>
 <div class="big"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="#dfe4f1" stroke-width="11"/><circle cx="60" cy="60" r="52" fill="none" stroke="#c9a227" stroke-width="11" stroke-linecap="round" stroke-dasharray="${R.toFixed(1)}" stroke-dashoffset="${(R*(1-p/100)).toFixed(1)}" transform="rotate(-90 60 60)"/><text x="60" y="62" text-anchor="middle" dominant-baseline="central" font-size="26" font-weight="700" fill="#14296b">${p}%</text></svg>
 <div><b style="font-size:1.15rem;color:var(--b2)">التقدير العام: ${a?gdg(p):"لم يبدأ بعد"}</b><div style="font-size:.88rem;color:var(--mu)">أجاب عن ${a} من ${n} سؤالًا، منها ${c} إجابة صحيحة.</div></div></div>
 <div class="hd" style="background:var(--b)">📋 الأداء حسب المحور</div><div class="tw"><table class="tbl" style="--a:#1d3f9e;min-width:0"><tr><th>المحور</th><th>أجاب</th><th>صحيحة</th><th>النسبة</th><th>التقدير</th></tr>
 ${st.map(s=>`<tr><td>${s.x.i} ${s.x.n}</td><td>${s.a}/${s.n}</td><td>${s.c}</td><td><div class="rbar"><i style="width:${s.p}%;background:${s.x.c}"></i></div>${s.p}%</td><td>${s.a?gdg(s.p):"—"}</td></tr>`).join("")}</table></div>
 <div class="hd" style="background:var(--b)">📈 الأداء حسب مستوى الصعوبة</div><div class="st">${[["تأسيسي",1],["متوسط",2],["متقدّم",3]].map(m=>`<div><b>${L[m[1]][0]} / ${L[m[1]][1]}</b>${m[0]}</div>`).join("")}</div>
 <div class="hd" style="background:var(--ok)">⭐ نقاط القوة</div>${li(strong,s=>`<li>${s.x.n}: ${s.p}%</li>`)}
 <div class="hd" style="background:var(--no)">🎯 يحتاج إلى تدريب</div>${li(weak,s=>`<li><b>${s.x.n}</b> (${s.p}%): ${s.x.tips[0]}</li>`)}
 ${idle.length?`<div class="hd" style="background:var(--g2)">🚀 لم يكتمل بعد</div>${li(idle,s=>`<li>${s.x.n}: أجاب عن ${s.a} فقط، يُنصح بإكمال التمارين.</li>`)}`:""}
 <div class="hd" style="background:var(--b)">👨‍👩‍👧 توصيات لولي الأمر</div><ul class="lst"><li>التدريب القصير اليومي (١٥ دقيقة) أفضل من جلسة طويلة.</li><li>اطلبوا من الطالب أن يشرح طريقة الحل بصوته.</li>${(weak.length?weak:st).slice(0,2).map(s=>`<li>${s.x.n}: ${s.x.parent}</li>`).join("")}</ul>
 <div class="sg"><div>توقيع المعلم</div><div>توقيع ولي الأمر</div></div>
 <div class="foot"><span>إعداد الأستاذ أسامة إبراهيم</span><span dir="ltr">TikTok @osam.ibrahem</span></div>
 <div class="noprint" style="display:grid;gap:8px"><button class="btn gold big" onclick="window.print()">🖨 طباعة / حفظ PDF</button><button class="btn light big" onclick="closeT()">العودة للرئيسية</button></div></div></div>`}

/* ================= المختبر المتحرك ================= */
let raf=0,paused=false,th=0,last=0,L={m:"mesh",n:3};
function stopLab(){cancelAnimationFrame(raf);raf=0}
function buildLab(){
 const sv=$("#lsv");if(!sv)return;let s="",lt="";
 if(L.m==="mesh"){const Ts=[14,20,14,20,14].slice(0,L.n),rs=Ts.map(t=>t*M),y=62;let x=12+rs[0],xs=[x];
  for(let i=1;i<Ts.length;i++){x+=rs[i-1]+rs[i];xs.push(x)}const W=x+rs[rs.length-1]+12;sv.setAttribute("viewBox",`0 0 ${W.toFixed(0)} 128`);
  Ts.forEach((t,i)=>{s+=gearG("g"+i,xs[i],y,t,0,i)+`<text id="d${i}" x="${xs[i]}" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="${B}"></text>`});
  lt="التروس المتلامسة تدور بالتناوب: اتجاه ثم عكسه، والأصغر أسنانًا أسرع.";}
 else{const cr=L.m==="cross",r1=14*M,r2=24*M,y=70,x1=12+r1,x2=x1+r1+r2+70,W=x2+r2+12;sv.setAttribute("viewBox",`0 0 ${W.toFixed(0)} 150`);
  const d=belt(x1,r1,x2,r2,y,cr);
  s=`<path d="${d}" fill="none" stroke="#6b7694" stroke-width="5" stroke-linejoin="round"/><path id="bd" d="${d}" fill="none" stroke="${G}" stroke-width="1.6" stroke-dasharray="7 6"/>`+gearG("g0",x1,y,14,0,0)+gearG("g1",x2,y,24,0,1)+`<text id="d0" x="${x1}" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="${B}"></text><text id="d1" x="${x2}" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="${B}"></text>`;
  lt=cr?"السير المتقاطع يعكس الاتجاه، والترس الأصغر (١٤ سنًّا) أسرع من الأكبر (٢٤).":"السير المفتوح يُبقي الاتجاه نفسه، والترس الأصغر (١٤ سنًّا) أسرع من الأكبر (٢٤).";}
 sv.innerHTML=s;$("#lt").textContent=lt;
 document.querySelectorAll("#lc [data-m]").forEach(b=>b.classList.toggle("on",b.dataset.m===L.m));
 document.querySelectorAll("#lc [data-a]").forEach(b=>{if(b.dataset.a!=="p")b.style.display=L.m==="mesh"?"":"none"})}
function frame(t){raf=requestAnimationFrame(frame);if(!$("#lsv")){stopLab();return}
 const dt=Math.min(.05,(t-last)/1000||0);last=t;if(!paused)th+=dt*1.1;
 let an,dirs;
 if(L.m==="mesh"){const Ts=[14,20,14,20,14].slice(0,L.n);an=meshAng(Ts,th);dirs=an.map((_,i)=>i%2?"↺":"↻")}
 else{const sg=L.m==="cross"?-1:1;an=[th*180/PI,sg*th*(14/24)*180/PI];dirs=["↻",sg>0?"↻":"↺"];const bd=$("#bd");if(bd)bd.setAttribute("stroke-dashoffset",(-th*14*M).toFixed(1))}
 an.forEach((a,i)=>{const g=$("#g"+i);if(g){g.setAttribute("transform",g.getAttribute("transform").replace(/rotate\([^)]*\)/,"rotate("+a.toFixed(2)+")"))}const d=$("#d"+i);if(d)d.textContent=dirs[i]+" "+"ABCDE"[i]});
 lever()}
function lever(){const f=+$("#lvr").value/100,fx=40+320*f,a=Math.max(-16,Math.min(16,(20*(1-f)*320-60*f*320)/1800)),bal=Math.abs(60*f-20*(1-f))<1.2;
 $("#lvs").innerHTML=`<line x1="15" y1="178" x2="385" y2="178" stroke="#dfe4f1" stroke-width="5" stroke-linecap="round"/>
 <polygon points="${fx},120 ${fx-26},178 ${fx+26},178" fill="#e8eefc" stroke="#1d3f9e" stroke-width="2.2" stroke-linejoin="round"/><circle cx="${fx}" cy="120" r="5" fill="${G}" stroke="#14296b" stroke-width="1.5"/>
 <g style="transform:rotate(${a.toFixed(1)}deg);transform-origin:${fx}px 120px;transition:transform .5s ease"><rect x="40" y="108" width="320" height="12" rx="5" fill="#2c52b8"/>
 <rect x="44" y="64" width="50" height="44" rx="6" fill="#8b94a8" stroke="#5b6482" stroke-width="2"/><text x="69" y="92" text-anchor="middle" font-size="12" fill="#fff">٦٠ كجم</text>
 <line x1="346" y1="60" x2="346" y2="100" stroke="#0f7a55" stroke-width="3"/><polygon points="346,106 339,92 353,92" fill="#0f7a55"/><text x="346" y="52" text-anchor="middle" font-size="12" font-weight="700" fill="#0f7a55">٢٠ كجم</text></g>
 <text x="${fx}" y="198" text-anchor="middle" font-size="12" fill="${MU}">نقطة الارتكاز</text>`;
 const l=Math.round(60*f*10)/10,r=Math.round(20*(1-f)*10)/10;
 $("#lvt").textContent=bal?"✅ متوازنة! عزم الحمل = عزم القوة (الارتكاز عند ربع الطول من جهة الحمل)":(a<0?"الحمل أثقل عزمًا فتميل جهته":"القوة أكبر عزمًا فتميل جهتها")+" — عزم الحمل ٦٠×"+(f*10).toFixed(1)+" مقابل ٢٠×"+((1-f)*10).toFixed(1)}
function initLab(){L={m:"mesh",n:3};paused=false;th=0;buildLab();
 $("#lc").onclick=e=>{const b=e.target.closest("button");if(!b)return;
  if(b.dataset.m){L.m=b.dataset.m;buildLab()}
  else if(b.dataset.a==="+"&&L.n<5){L.n++;buildLab()}else if(b.dataset.a==="-"&&L.n>2){L.n--;buildLab()}else if(b.dataset.a==="p")paused=!paused};
 last=performance.now();raf=requestAnimationFrame(frame)}

load();home();
</script>
